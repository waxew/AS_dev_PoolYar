name: Android Build Check

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Build demo debug APK
        run: ./gradlew :mobile:assembleDemoDebug --stacktrace --no-daemon

      - name: Upload demo debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AS-PoolYar-demo-debug-apk
          path: mobile/build/outputs/apk/demo/debug/*.apk
          if-no-files-found: error
